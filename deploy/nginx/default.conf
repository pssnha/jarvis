# Reverse proxy for the Jarvis stack.
#
# This file ships HTTP-only so nginx starts cleanly before any TLS certificate
# exists. It serves the ACME challenge and proxies traffic. After you issue a
# certificate (see deploy/README.md), uncomment the HTTPS server block at the
# bottom, set your domain, and switch the HTTP block to redirect to HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # REST API + WhatsApp webhook
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Web app (static SPA served by the `web` container)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}

# ---------------------------------------------------------------------------
# After running certbot (deploy/README.md), replace YOUR_DOMAIN below and
# uncomment this block. Then change the port-80 block's `location /` to:
