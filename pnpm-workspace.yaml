packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts (pnpm blocks these by default).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# Dedupe ioredis to a single version so bullmq and our code share one type/instance.
overrides:
  ioredis: ^5.11.1
